- name: play level variables
  hosts: local
  connection: local #ansible_connection=local
  vars:
    COURSE: Ansible
    DURATION: 10HRS
    Trainer: Ashok kumar
  tasks:
    - name: print the course info
      ansible.builtin.debug:
        msg: "Course Name is: {{ COURSE }}, Duration: {{ DURATION }}, Trainer: {{ Trainer }}
